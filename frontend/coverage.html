<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];

  gtag('config', 'G-GXDVD1Y71E');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coverage || Savanna Fibre</title>
    <link rel="icon" type="image/svg+xml" href="assets/preloader orange.svg" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            height: 100%; 
            overflow: hidden;
            background: #f8f9fa;
        }
        #coverage-frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }
        .loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, #f89621 0%, #f5a623 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader img {
            height: 80px;
            margin-bottom: 20px;
        }
        .loader p {
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 500;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div class="loader" id="loader">
        <img src="Logo savanna6.svg" alt="Savanna Fibre">
        <p>Loading Coverage Checker...</p>
        <div class="spinner"></div>
    </div>

    <!-- Full Screen Iframe -->
    <iframe 
        id="coverage-frame" 
        src="https://savannafibre.site/mdu-fat-coverage/" 
        allow="geolocation"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-geolocation"
    ></iframe>

    <script>
        const frame = document.getElementById('coverage-frame');
        const loader = document.getElementById('loader');

        frame.onload = function() {
            setTimeout(() => {
                loader.classList.add('hidden');
                frame.style.display = 'block';
            }, 800);
        };

        // Fallback if load takes too long
        setTimeout(() => {
            loader.classList.add('hidden');
            frame.style.display = 'block';
        }, 5000);
    </script>

</body>
</html>
